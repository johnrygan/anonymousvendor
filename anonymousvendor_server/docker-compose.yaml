services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: anonymousvendor
      POSTGRES_PASSWORD: "9zTyVMhNl2SG-v9TfTbxMuYJnghMn2a7"
    volumes:
      - anonymousvendor_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Q15YzvkSRSjV5bhg63DNqATzK7RQb05d"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: anonymousvendor_test
      POSTGRES_PASSWORD: "R2vd_2EaL6CnEXuP0gmkQlwvtl9yBzPl"
    volumes:
      - anonymousvendor_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "Y-rueZ_xBTGnaNMgk1_lDzUVEHIYxTk-"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  anonymousvendor_data:
  anonymousvendor_test_data:
